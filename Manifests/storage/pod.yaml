apiVersion: v1
kind: Pod
metadata:
  name: storage-writer
  namespace: lab-p0
  labels:
    app.kubernetes.io/name: storage-writer
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "date >> /data/heartbeat.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: demo-data
