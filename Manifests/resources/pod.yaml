apiVersion: v1
kind: Pod
metadata:
  name: resource-demo
  namespace: lab-p0
  labels:
    app.kubernetes.io/name: resource-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do sleep 30; done"]
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
          ephemeral-storage: 256Mi
