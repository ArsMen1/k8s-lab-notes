apiVersion: v1
kind: Service
metadata:
  # Имя сервиса. По нему будет DNS: payments-svc.default.svc.cluster.local
  name: payments-svc
  namespace: default
spec:
  # Как сервис находит поды: ищет label app=payments-api
  selector:
    app: payments-api
  ports:
    - # Порт, на котором слушает сам Service (ClusterIP)
      port: 80
      # Порт контейнера внутри пода
      targetPort: 80
  # ClusterIP — доступен только внутри кластера
  type: ClusterIP
