apiVersion: v1
kind: Service
metadata:
  name: payments-svc # Имя сервиса. По нему будет создано DNS-имя.
  namespace: default # Должен быть тот же, что и у подов.
spec:
  selector:
    app:
      payments-api # 👈 САМОЕ ВАЖНОЕ. Как сервис находит свои поды?
      # Он ищет все поды с лейблом app=payments-api.
  ports:
    - port: 80 # Порт, на котором будет слушать сам Service.
      targetPort: 80 # Порт, на котором слушает контейнер внутри пода.
  type: ClusterIP # Тип сервиса. Об этом ниже.
