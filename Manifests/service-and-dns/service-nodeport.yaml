apiVersion: v1
kind: Service
metadata:
  name: payments-nodeport
  namespace: default
  labels:
    app: payments-api
spec:
  type: NodePort
  selector:
    app: payments-api
  ports:
    - name: http
      port: 80
      targetPort: 80
      # Фиксируем порт для лабы. В проде чаще оставляют авто-выбор.
      nodePort: 30080
