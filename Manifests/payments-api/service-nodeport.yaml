# Только учебный кластер без Ingress. В проде этот файл не нужен.
apiVersion: v1
kind: Service
metadata:
  name: payments-api-nodeport
  namespace: payments
  labels:
    app.kubernetes.io/name: payments-api
    app.kubernetes.io/part-of: payments
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: payments-api
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
