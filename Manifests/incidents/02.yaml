apiVersion: v1
kind: Namespace
metadata:
  name: incidents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: receipts
  namespace: incidents
  labels:
    app.kubernetes.io/name: receipts
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: receipts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: receipts
    spec:
      containers:
        - name: worker
          image: nginx:1.27-alpine
          command: ["sh", "-c"]
          args:
            - |
              echo "startup check: db.payments.svc:5432: connection refused" >&2
              exit 1
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
