apiVersion: v1
kind: Namespace
metadata:
  name: incidents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-front
  namespace: incidents
  labels:
    app.kubernetes.io/name: shop-front
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-front
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-front
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: shop-front
  namespace: incidents
  labels:
    app.kubernetes.io/name: shop-front
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: shop-front-v2
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
