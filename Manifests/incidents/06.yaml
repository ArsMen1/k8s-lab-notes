apiVersion: v1
kind: Namespace
metadata:
  name: incidents
---
apiVersion: v1
kind: Secret
metadata:
  name: payouts
  namespace: incidents
type: Opaque
stringData:
  PASSWORD: changeme-lab-only
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payouts
  namespace: incidents
  labels:
    app.kubernetes.io/name: payouts
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payouts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payouts
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payouts
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
