apiVersion: v1
kind: Namespace
metadata:
  name: incidents
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: incidents
  labels:
    app.kubernetes.io/name: ledger
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: "64"
              memory: 64Mi
            limits:
              cpu: "64"
              memory: 128Mi
