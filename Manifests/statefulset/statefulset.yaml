apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: lab-p0
spec:
  serviceName: web
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          command: ["/bin/sh", "-c"]
          args: ["if [ ! -f /usr/share/nginx/html/data/identity.txt ]; then echo created-on-first-start > /usr/share/nginx/html/data/identity.txt; fi; echo $HOSTNAME >> /usr/share/nginx/html/data/starts.log; exec nginx -g 'daemon off;'"]
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
