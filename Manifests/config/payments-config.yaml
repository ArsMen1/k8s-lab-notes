apiVersion: v1
kind: ConfigMap
metadata:
  name: payments-config
  namespace: default
data:
  APP_MODE: lab
  LOG_LEVEL: debug
---
apiVersion: v1
kind: Secret
metadata:
  name: payments-secret
  namespace: default
type: Opaque
stringData:
  # stringData удобнее для учебки: Kubernetes сам сделает base64.
  # Не кладите реальные прод-секреты в Git.
  DB_PASSWORD: "changeme-lab-only"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api-config
  namespace: default
  labels:
    app: payments-api-config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api-config
  template:
    metadata:
      labels:
        app: payments-api-config
    spec:
      containers:
        - name: api
          image: nginx:alpine
          ports:
            - containerPort: 80
          env:
            - name: APP_MODE
              valueFrom:
                configMapKeyRef:
                  name: payments-config
                  key: APP_MODE
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: payments-config
                  key: LOG_LEVEL
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-secret
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
