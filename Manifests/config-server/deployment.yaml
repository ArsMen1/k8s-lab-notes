apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: platform
  labels:
    app.kubernetes.io/name: config-server
    app.kubernetes.io/part-of: platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: config-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-server
        app.kubernetes.io/part-of: platform
    spec:
      containers:
        - name: config-server
          image: kaliware/config-server:0.0.3-SNAPSHOT
          ports:
            - name: http
              containerPort: 8888
          env:
            - name: CONFIG_SERVER_GIT_URI
              value: https://github.com/spring-cloud-samples/config-repo
            - name: CONFIG_SERVER_FORCE_PULL
              value: "true"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
