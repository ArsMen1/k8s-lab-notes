apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-p1-hpa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hpa-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hpa-web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/hpa-example
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
