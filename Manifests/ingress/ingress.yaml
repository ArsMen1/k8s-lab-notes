apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: lab-p1-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.lab.test
      secretName: app-tls
  rules:
    - host: app.lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
