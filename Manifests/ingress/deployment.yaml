apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: lab-p1
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingress-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingress-web
    spec:
      containers:
        - name: web
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
