
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: databases.lab.example.com

spec:
  group: lab.example.com

  scope: Namespaced

  names:
    plural: databases
    singular: database
    kind: Database
    shortNames:
      - db

  versions:
    - name: v1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object

              properties:
                engine:
                  type: string
                  enum:
                    - postgres
                    - mysql

                version:
                  type: string

                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10

              required:
                - engine
                - version

          required:
            - spec
