
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: databases.lab.example.com

spec:
  group: lab.example.com
  scope: Namespaced

  names:
    plural: databases
    singular: database
    kind: Database
    shortNames:
      - db

  versions:
    - name: v1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object

              properties:
                engine:
                  type: string
                  enum:
                    - postgres
                    - mysql

                version:
                  type: string
                  default: "17"

                replicas:
                  type: integer
                  minimum: 1
                  maximum: 10

                minReplicas:
                  type: integer
                  minimum: 1

                maxReplicas:
                  type: integer
                  maximum: 10

              required:
                - engine

              x-kubernetes-validations:
                - rule: "has(self.minReplicas) == has(self.maxReplicas)"
                  message: "minReplicas and maxReplicas must be specified together"

                - rule: "!has(self.minReplicas) || self.minReplicas <= self.maxReplicas"
                  message: "minReplicas must be less than or equal to maxReplicas"

          required:
            - spec
