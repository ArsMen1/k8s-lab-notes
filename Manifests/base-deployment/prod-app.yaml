# apiVersion — версия API Kubernetes, которую используем.
# apps/v1 — стабильная версия для Deployment (не v1, не extensions/v1beta1).
apiVersion: apps/v1

# kind — тип создаваемого объекта.
# Deployment — контроллер, который управляет репликами подов и их обновлениями.
kind: Deployment

# metadata — служебная информация об объекте (имя, пространство имён, метки).
metadata:
  # name — уникальное имя Deployment в рамках namespace.
  name: payments-api

  # namespace — логическое пространство, где будет жить объект.
  # default — стандартный namespace, если не указан другой.
  namespace: default

  # labels — метки самого Deployment (не подов).
  # По ним удобно искать объект: kubectl get deploy -l tier=backend
  labels:
    app: payments-api # приложение называется payments-api
    tier: backend # это бэкенд-сервис

# spec — желаемое состояние Deployment (что мы хотим получить).
spec:
  # replicas — сколько одинаковых подов должно работать одновременно.
  # Kubernetes будет следить, чтобы их было ровно 3.
  replicas: 3

  # selector — правило, по которому Deployment находит «свои» поды.
  # Он управляет только теми подами, чьи метки совпадают с matchLabels.
  selector:
    matchLabels:
      app: payments-api # поды с меткой app=payments-api принадлежат этому Deployment

  # template — шаблон для создания подов.
  # Всё, что внутри, — это как бы отдельный YAML для Pod.
  template:
    # metadata внутри template — метки, которые получат созданные поды.
    metadata:
      labels:
        app: payments-api # обязательно должно совпадать с selector.matchLabels
        tier: backend # дополнительная метка для удобства (не участвует в selector)

    # spec внутри template — описание контейнеров внутри пода.
    spec:
      # containers — список контейнеров в поде. У нас один.
      containers:
        # name — имя контейнера внутри пода (для логов, exec и т.п.).
        - name: api

          # image — Docker-образ, который запускаем.
          # nginx:alpine — лёгкий образ веб-сервера Nginx.
          image: nginx:alpine

          # ports — какие порты открывает контейнер.
          ports:
            # containerPort — порт внутри контейнера, который слушает приложение.
            # Для Nginx по умолчанию это 80.
            - containerPort: 80

          # resources — ограничения и гарантии по ресурсам для контейнера.
          resources:
            # requests — сколько ресурсов Kubernetes гарантирует контейнеру.
            # По этим значениям планировщик выбирает ноду, где хватит места.
            requests:
              memory: "64Mi" # минимум 64 мебибайта памяти
              cpu: "100m" # минимум 0.1 CPU (100 millicores = 0.1 ядра)

            # limits — максимальный потолок ресурсов.
            # Если контейнер превысит лимит по памяти — его убьют (OOMKilled).
            # Если превысит лимит по CPU — его начнут «тормозить» (throttling).
            limits:
              memory: "128Mi" # максимум 128 мебибайт памяти
              cpu: "200m" # максимум 0.2 CPU (200 millicores)
