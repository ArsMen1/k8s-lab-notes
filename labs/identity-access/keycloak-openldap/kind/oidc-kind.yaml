kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
    extraMounts:
      - hostPath: ./certs/rootCA.pem
        containerPath: /etc/kubernetes/pki/oidc-root-ca.pem
        readOnly: true
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            oidc-issuer-url: "https://sso.iam.test:8443/realms/k8s-lab"
            oidc-client-id: "kubernetes"
            oidc-username-claim: "preferred_username"
            oidc-username-prefix: "oidc:"
            oidc-groups-claim: "groups"
            oidc-groups-prefix: "oidc:"
            oidc-ca-file: "/etc/kubernetes/pki/oidc-root-ca.pem"
