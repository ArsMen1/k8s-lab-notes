# Local learning cluster only
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-lab
nodes:
  - role: control-plane
    extraPortMappings:
      # Existing NodePort access for app labs: localhost:8080 -> 30080.
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Traefik Ingress access: localhost:80 -> NodePort 30081.
      - containerPort: 30081
        hostPort: 80
        listenAddress: "127.0.0.1"
        protocol: TCP
      # Traefik HTTPS access: localhost:443 -> NodePort 30443.
      - containerPort: 30443
        hostPort: 443
        listenAddress: "127.0.0.1"
        protocol: TCP
  - role: worker
